# Builds the "Inicio" Home screen for Windows and publishes the installer as a
# downloadable artifact of the run (Actions tab -> latest run -> Artifacts).
name: Build Inicio for Windows

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-inicio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci

      # The Windows code embeds the built screens, so build them before linting it.
      - run: npm run build

      - name: Lint the Windows code
        working-directory: app/src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Build the installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Inicio-instalador
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
